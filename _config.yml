title: airisu.dev
description: Personal site of airisu-dev
url: "https://airisu-dev.github.io"
theme: minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-polyglot

# Polyglot i18n settings
languages: ["en", "vi"]
default_lang: "en"
parallel_localization: true
# jekyll-sitemap generates its own sitemap.xml per language pass; excluding it
# from localization keeps a single canonical sitemap instead of colliding copies.
exclude_from_localization: ["sitemap.xml"]
