<div class="language-switcher">
  {%- for lang in site.languages -%}
    <a
      class="{% if lang == page.lang %}active{% endif %}"
      {% static_href %}href="{% if lang == site.default_lang %}{{ site.baseurl }}{{ page.url }}{% else %}{{ site.baseurl }}/{{ lang }}{{ page.url }}{% endif %}"{% endstatic_href %}
    >{{ lang | upcase }}</a>
  {%- endfor -%}
</div>
