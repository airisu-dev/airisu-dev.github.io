{%- assign current = page.lang | default: site.default_lang -%}
{%- assign current_name = site.data.language_names[current] | default: current -%}
<a class="nav-link" id="nav-lang-link" href="{{ "/language/" | relative_url }}" title="{{ current_name }}">
  <span id="nav-lang-icon" class="fa fa-globe"></span>
  <span id="nav-lang-text">{{ current_name }}</span>
</a>
